name: Docker Image CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:
  schedule:
  - cron: "0 6 1 * *"

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - name: Check out the repository
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to GitHub Docker registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}  # GitHub automatically provides this token

    - name: Build Docker image
      run: |
        docker build -t ghcr.io/${{ github.repository }}/fronius-influx-exporter:$(date +'%y%m%d') .
        docker build -t ghcr.io/${{ github.repository }}/fronius-influx-exporter:latest .

    - name: Push Docker image
      run: |
        docker push ghcr.io/${{ github.repository }}/fronius-influx-exporter:$(date +'%y%m%d')
        docker push ghcr.io/${{ github.repository }}/fronius-influx-exporter:latest